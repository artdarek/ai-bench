services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "40240:80"
    volumes:
      - ./services/website:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./services/website:/app/services/website:ro
      - ./services/storage/data/snapshots:/app/data/snapshots
    restart: unless-stopped
