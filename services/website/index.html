<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Bench</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="app-bg">
    <main class="container py-4 py-md-5">
      <header class="mb-4">
        <h1 class="fw-bold mb-1">AI Bench</h1>
        <p class="text-secondary mb-0">Prompt testing, model comparison, and cost tracking (Chat Completions).</p>
      </header>

      <section class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-4">
              <label class="form-label fw-semibold" for="provider">Provider</label>
              <select id="provider" class="form-select"></select>
            </div>

            <div class="col-12 col-md-4" id="modelWrap">
              <label class="form-label fw-semibold" for="model">Model</label>
              <select id="model" class="form-select"></select>
            </div>

            <div class="col-12 col-md-4 hidden" id="deploymentWrap">
              <label class="form-label fw-semibold" for="deployment">Deployment</label>
              <select id="deployment" class="form-select"></select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="systemPrompt">System Prompt</label>
            <textarea id="systemPrompt" class="form-control" rows="5" placeholder="System instructions"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="message">Message</label>
            <textarea id="message" class="form-control" rows="5" placeholder="User message"></textarea>
          </div>

          <div class="actions d-flex flex-wrap gap-2">
            <button id="sendBtn" class="btn btn-primary">
              <i class="bi bi-send-fill me-2" aria-hidden="true"></i>Send
            </button>
            <button id="exportBtn" class="btn btn-outline-primary">
              <i class="bi bi-file-earmark-spreadsheet-fill me-2" aria-hidden="true"></i>Export CSV
            </button>
            <button id="clearBtn" class="btn btn-outline-danger">
              <i class="bi bi-trash3-fill me-2" aria-hidden="true"></i>Clear History
            </button>
          </div>

          <p id="status" class="status text-secondary mb-0 mt-3"></p>
        </div>
      </section>

      <section class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h2 class="h4 mb-3">Response</h2>
          <pre id="answer" class="response-box mb-3"></pre>

          <div class="usage d-flex flex-wrap gap-3" id="usageBox">
            <span class="badge text-bg-light border">Input: <strong id="inputTokens" class="ms-1">0</strong></span>
            <span class="badge text-bg-light border">Output: <strong id="outputTokens" class="ms-1">0</strong></span>
            <span class="badge text-bg-light border">Total: <strong id="totalTokens" class="ms-1">0</strong></span>
            <span class="badge text-bg-success">Cost: <strong id="totalCost" class="ms-1">$0.00000000</strong></span>
          </div>
        </div>
      </section>

      <section class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="h4 mb-3">Test History</h2>
          <div id="history" class="history"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
